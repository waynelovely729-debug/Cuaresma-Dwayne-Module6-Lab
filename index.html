<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Seminar Registration Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>IT Seminar Registration</h1>

    <!-- Success Message Container -->
    <div id="successMessage" class="success-message" role="alert"></div>

    <!-- Registration Summary Container -->
    <div id="registrationSummary" class="summary-card" hidden>
      <h2>Registration Summary</h2>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>

    <!-- Registration Form -->
    <form id="registrationForm" novalidate>
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          required 
          aria-describedby="fullNameError"
        >
        <span id="fullNameError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Student Number -->
      <div class="form-group">
        <label for="studentNumber">Student Number</label>
        <input 
          type="text" 
          id="studentNumber" 
          name="studentNumber" 
          placeholder="e.g., 24-1234-123" 
          required 
          aria-describedby="studentNumberError"
        >
        <span id="studentNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Email Address -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          aria-describedby="emailError"
        >
        <span id="emailError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <label for="mobileNumber">Mobile Number</label>
        <input 
          type="tel" 
          id="mobileNumber" 
          name="mobileNumber" 
          placeholder="e.g., 09123456789 or +639123456789" 
          required 
          aria-describedby="mobileNumberError"
        >
        <span id="mobileNumberError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          aria-describedby="passwordFeedback passwordError"
        >
        <span id="passwordFeedback" class="feedback-message" aria-live="polite"></span>
        <span id="passwordError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          required 
          aria-describedby="confirmPasswordError"
        >
        <span id="confirmPasswordError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Course -->
      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" required aria-describedby="courseError">
          <option value="" disabled selected>Select your course</option>
          <option value="BSIT">BSIT</option>
          <option value="BSCS">BSCS</option>
        </select>
        <span id="courseError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Terms Agreement -->
      <div class="form-group checkbox-group">
        <label for="terms">
          <input 
            type="checkbox" 
            id="terms" 
            name="terms" 
            required 
            aria-describedby="termsError"
          >
          I agree to the terms and conditions
        </label>
        <span id="termsError" class="error-message" aria-live="polite"></span>
      </div>

      <!-- Form Action Buttons -->
      <div class="button-group">
        <button type="submit" id="registerBtn">Register</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>

    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
